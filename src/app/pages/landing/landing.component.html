<section class="landing" [class.leaving]="leaving">
  <app-ambient-sparkles [count]="70"></app-ambient-sparkles>

  <div class="glow" aria-hidden="true"></div>
  <div class="glow glow-2" aria-hidden="true"></div>
  <div class="ring-glow" aria-hidden="true"></div>

  <div class="content">
    <p class="section-eyebrow">{{ content.eyebrow }}</p>
    <h1 class="title">
      <span class="line">{{ content.greeting }},</span>
      <span class="script name">{{ name }}</span>
    </h1>
    <p class="subline">{{ content.subline }}</p>

    <button class="cta" type="button" (click)="begin()">
      <span>{{ content.cta }}</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</section>
