<section class="dna-section" id="story">
  <app-ambient-sparkles [count]="38"></app-ambient-sparkles>

  <div class="heading">
    <p class="section-eyebrow">{{ content.eyebrow }}</p>
    <h2>{{ content.title }}</h2>
    <span class="divider" aria-hidden="true"></span>
    <p class="subtitle">{{ content.subtitle }}</p>
  </div>

  <div class="dna-wrapper" [style.height.vh]="chapters.length * 95" (appScrollProgress)="onProgress($event)">
    <div class="dna-viewport">
      <div class="focus-glow" aria-hidden="true"></div>

      <div class="card-stack">
        <article
          class="card"
          *ngFor="let v of views"
          [style.opacity]="v.opacity"
          [style.transform]="'translate(' + v.translateX + 'px, ' + v.translateY + 'px) scale(' + v.scale + ') rotate(' + v.rotate + 'deg)'"
          [style.z-index]="v.z"
          [style.pointer-events]="v.opacity < 0.15 ? 'none' : 'auto'"
        >
          <div class="polaroid">
            <div class="photo">
              <img *ngIf="!v.chapter.broken" [src]="v.chapter.photo" [alt]="v.chapter.title" (error)="onImgError(v.chapter)" loading="lazy" />
              <div class="placeholder" *ngIf="v.chapter.broken">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                  <path d="M4 16l4.5-5 3 3L17 8l3 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  <rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
                  <circle cx="8" cy="9" r="1.2" fill="currentColor"/>
                </svg>
              </div>
            </div>
          </div>

          <div class="text-block">
            <p class="chapter-label">{{ v.chapter.label }}</p>
            <h3>{{ v.chapter.title }}</h3>
            <p class="chapter-text">{{ v.chapter.text }}</p>
          </div>
        </article>
      </div>

      <p class="scroll-hint">keep scrolling to continue her story</p>
    </div>
  </div>
</section>
