<section class="wheel-section" id="memories">
  <div class="wheel-wrapper" [style.height.vh]="memories.length * 55" (appScrollProgress)="onProgress($event)">
    <div class="wheel-viewport">
      <app-ambient-sparkles [count]="32"></app-ambient-sparkles>

      <div class="heading">
        <p class="section-eyebrow">{{ content.eyebrow }}</p>
        <h2>{{ content.title }}</h2>
        <span class="divider" aria-hidden="true"></span>
      </div>

      <div class="ring" aria-hidden="true"></div>

      <div class="pivot">
        <div
          class="card"
          *ngFor="let v of views"
          [class.focused]="v.focused"
          [style.transform]="'rotate(' + v.angle + 'deg) translateY(calc(var(--arc-radius) * -1)) rotate(' + (-v.angle) + 'deg) scale(' + v.scale + ')'"
          [style.opacity]="v.opacity"
          [style.visibility]="v.opacity === 0 ? 'hidden' : 'visible'"
          [style.z-index]="v.z"
        >
          <div class="frame">
            <img *ngIf="v.memory.photo && !v.memory.broken" [src]="v.memory.photo" [alt]="v.memory.caption" (error)="onImgError(v.memory)" loading="lazy" />
            <div class="placeholder" *ngIf="!v.memory.photo || v.memory.broken">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                <path d="M4 16l4.5-5 3 3L17 8l3 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="8" cy="9" r="1.2" fill="currentColor"/>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <div class="caption-readout">
        <p class="caption">{{ focusedMemory.caption }}</p>
        <p class="date" *ngIf="focusedMemory.date">{{ focusedMemory.date }}</p>
      </div>

      <p class="scroll-hint">keep scrolling to turn the wheel</p>
    </div>
  </div>
</section>
