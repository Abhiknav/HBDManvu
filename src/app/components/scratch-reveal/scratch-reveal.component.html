<section class="scratch-section" id="scratch">
  <app-ambient-sparkles [count]="42"></app-ambient-sparkles>

  <div class="heading" appReveal>
    <p class="section-eyebrow">{{ content.eyebrow }}</p>
    <h2 class="gradient-heading">{{ content.title }}</h2>
    <p class="subtitle">{{ content.subtitle }}</p>
  </div>

  <div class="wrap" #wrap appReveal>
    <div class="reveal-content">
      <div class="gift" *ngIf="content.portfolioUrl">
        <p class="gift-line">{{ content.giftLine }}</p>
        <a class="qr" [href]="content.portfolioUrl" target="_blank" rel="noopener noreferrer">
          <img [src]="content.portfolioQr" alt="QR code linking to Manvi’s portfolio" />
        </a>
        <a class="gift-link" [href]="content.portfolioUrl" target="_blank" rel="noopener noreferrer">
          {{ content.portfolioLinkLabel }}
        </a>
      </div>
    </div>

    <canvas
      #canvasEl
      class="scratch-canvas"
      [class.hidden]="revealed"
      (mousedown)="onStart($event)"
      (mousemove)="onMove($event)"
      (mouseup)="onEnd()"
      (mouseleave)="onEnd()"
      (touchstart)="onStart($event)"
      (touchmove)="onMove($event)"
      (touchend)="onEnd()"
    ></canvas>
  </div>

  <button class="fallback-btn" type="button" *ngIf="!revealed" (click)="reveal()">
    tap to reveal
  </button>
</section>
