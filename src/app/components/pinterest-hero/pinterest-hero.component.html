<section class="wall-hero" id="welcome">
  <div class="wall" aria-hidden="true">
    <div class="row" *ngFor="let row of rows" [style.animation-duration.s]="row.duration">
      <div class="tile" *ngFor="let photo of row.photos">
        <div class="placeholder"></div>
        <img [src]="photo" alt="" (error)="onImgError($event)" loading="lazy" />
      </div>
    </div>
  </div>

  <div class="scrim" aria-hidden="true"></div>

  <div class="hero-content">
    <h1 class="script headline">{{ content.headline }}</h1>
    <p class="subline">{{ content.subline }}</p>
  </div>

  <button class="scroll-cue" type="button" (click)="scrollToNext()">
    <span>{{ content.scrollCue }}</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</section>
